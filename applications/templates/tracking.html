<!DOCTYPE html>
<html>

<head>
    <title>Track Parcel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header>
    <h1>TrackSure</h1>
    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/create-shipment">Create Shipment</a>
        <a href="/track">Track Parcel</a>
    </nav>
</header>

<div class="container">

    <h2>Track Your Parcel</h2>

    <input
        id="tracking_id"
        placeholder="Enter Tracking ID"
    >

    <button id="track-btn" onclick="trackParcel()">
        Track Now
    </button>

    <div id="tracking-result"></div>

</div>

<script>

async function trackParcel() {

    const trackingId =
        document.getElementById("tracking_id").value.trim();

    const result =
        document.getElementById("tracking-result");

    if (!trackingId) {
        result.textContent = "Please enter a tracking ID.";
        return;
    }

    try {

        const response = await fetch(
            `/api/track/${encodeURIComponent(trackingId)}`
        );

        const data = await response.json();

        if (!response.ok) {
            result.textContent = data.detail;
            return;
        }

        result.innerHTML = `
            <h3>Shipment Details</h3>
            <p>Tracking ID: ${data.tracking_id}</p>
            <p>Receiver: ${data.receiver_name}</p>
            <p>Status: ${data.status}</p>

            <h3>Tracking History</h3>

            ${data.history.map(item =>
                `<p>${item.status} - ${item.updated_at}</p>`
            ).join("")}
        `;

    } catch (error) {

        result.textContent = "Unable to connect to server.";

    }

}

</script>

</body>
</html>
